<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundFont Tester</title>
<style>
  :root{
    --bg:#1b1b1d;
    --panel:#222225;
    --panel-raised:#2a2a2e;
    --line:#3a3a3f;
    --text:#e9e7e0;
    --text-dim:#9a9893;
    --amber:#ffb347;
    --amber-dim:#7a5a2c;
    --green:#7cd992;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---- header / drop zone ---- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  h1{
    font-family:var(--mono);
    font-size:15px;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--amber);
    margin:0;
    white-space:nowrap;
  }
  #dropzone{
    flex:1;
    border:1.5px dashed var(--line);
    border-radius:6px;
    padding:9px 14px;
    font-size:13px;
    color:var(--text-dim);
    cursor:pointer;
    transition:border-color .15s, background .15s;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  #dropzone.drag{border-color:var(--amber); background:rgba(255,179,71,.06); color:var(--text);}
  #dropzone .fname{color:var(--text); font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #fileInput{
    position:absolute;
    width:1px; height:1px;
    opacity:0; overflow:hidden;
  }
  #dragOverlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(255,179,71,.12);
    border:3px dashed var(--amber);
    z-index:999;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:18px;
    color:var(--amber);
    pointer-events:none;
  }
  #dragOverlay.show{display:flex;}
  #meta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  /* ---- main layout ---- */
  main{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---- preset list (LCD) ---- */
  #presetPane{
    width:300px;
    flex-shrink:0;
    background:#141416;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #presetPane .label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    color:var(--text-dim);
    padding:10px 14px 6px;
  }
  #presetList{
    flex:1;
    overflow-y:auto;
    padding:0 6px 10px;
  }
  .preset-row{
    font-family:var(--mono);
    font-size:12.5px;
    color:#8fdc9f;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
    padding:6px 8px;
    border-radius:3px;
    cursor:pointer;
    display:flex;
    gap:8px;
  }
  .preset-row:hover{background:#1e1e21;}
  .preset-row.active{background:var(--amber-dim); color:#fff3df;}
  .preset-row .idx{color:var(--text-dim); flex-shrink:0;}
  .preset-row.active .idx{color:#e0c090;}
  .preset-row .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #emptyState{
    padding:24px 16px;
    color:var(--text-dim);
    font-size:13px;
    line-height:1.5;
  }

  /* ---- right panel ---- */
  #playPane{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    padding:18px 24px;
    overflow:auto;
  }
  #currentPreset{
    font-family:var(--mono);
    font-size:20px;
    color:var(--text);
    min-height:28px;
  }
  #currentPreset .bank{color:var(--text-dim); font-size:14px; margin-right:8px;}
  #hint{
    color:var(--text-dim);
    font-size:12.5px;
    margin-top:4px;
    margin-bottom:20px;
  }
  #controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .btn{
    font-family:var(--sans);
    font-size:13px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--text);
    padding:7px 13px;
    border-radius:5px;
    cursor:pointer;
  }
  .btn:hover{border-color:var(--amber-dim);}
  .btn:active{background:var(--amber-dim);}
  #octaveLabel{font-family:var(--mono); font-size:13px; color:var(--amber); min-width:56px; text-align:center;}

  /* ---- piano ---- */
  #pianoWrap{
    overflow-x:auto;
    padding-bottom:8px;
  }
  #piano{
    position:relative;
    height:150px;
    display:flex;
    width:max-content;
  }
  .white-key{
    position:relative;
    width:38px;
    height:150px;
    background:#efeee9;
    border:1px solid #0000001a;
    border-radius:0 0 4px 4px;
    box-shadow:inset 0 -3px 0 #d8d6cd;
    cursor:pointer;
    flex-shrink:0;
  }
  .white-key.down{background:var(--amber);}
  .white-key .lbl{
    position:absolute;
    bottom:6px;
    left:0; right:0;
    text-align:center;
    font-family:var(--mono);
    font-size:9px;
    color:#8b887f;
    pointer-events:none;
  }
  .black-key{
    position:absolute;
    top:0;
    width:24px;
    height:92px;
    background:#232326;
    border:1px solid #000;
    border-radius:0 0 3px 3px;
    z-index:2;
    cursor:pointer;
  }
  .black-key.down{background:var(--amber);}

  #keymapHint{
    margin-top:14px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-dim);
    line-height:1.6;
  }
  #keymapHint b{color:var(--green); font-weight:600;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#3a3a3f; border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 720px){
    main{flex-direction:column;}
    #presetPane{width:100%; height:38vh; border-right:none; border-bottom:1px solid var(--line);}
    header{flex-wrap:wrap;}
    h1{width:100%;}
  }
</style>
</head>
<body>

<header>
  <h1>SOUNDFONT TESTER</h1>
  <label id="dropzone" for="fileInput">
    <span id="dzText">Arrastrá un archivo .sf2 a cualquier parte de la página, o tocá acá para elegirlo</span>
    <span class="fname" id="dzFname"></span>
  </label>
  <input type="file" id="fileInput" accept=".sf2,.sf3">
  <div id="meta"></div>
</header>
<div id="dragOverlay">Soltá el archivo .sf2 acá</div>

<main>
  <div id="presetPane">
    <div class="label">PRESETS</div>
    <div id="presetList">
      <div id="emptyState">Cargá un SoundFont para ver sus presets acá.</div>
    </div>
  </div>

  <div id="playPane">
    <div id="currentPreset">—</div>
    <div id="hint">Elegí un preset de la lista y tocá el teclado para escucharlo.</div>

    <div id="controls">
      <button class="btn" id="octDown">◀ octava</button>
      <span id="octaveLabel">C3–C6</span>
      <button class="btn" id="octUp">octava ▶</button>
      <button class="btn" id="fastTest" style="margin-left:auto;">⏩ fast test (todos los Do)</button>
      <button class="btn" id="testTone">🔊 probar audio (sin SoundFont)</button>
    </div>
    <div id="status" style="font-family:var(--mono); font-size:12px; color:var(--green); min-height:16px; margin:-10px 0 14px;"></div>

    <div id="pianoWrap">
      <div id="piano"></div>
    </div>

    <div id="keymapHint">
      Teclado del compu: <b>A W S E D F T G Y H U J</b> = una octava cromática &nbsp;·&nbsp; <b>Z / X</b> = bajar/subir octava
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------
  // Generator operator IDs we care about (SF2 spec)
  // ---------------------------------------------------------------
  const GEN = {
    startAddrsOffset: 0, endAddrsOffset: 1,
    startloopAddrsOffset: 2, endloopAddrsOffset: 3,
    instrument: 41, keyRange: 43, velRange: 44,
    coarseTune: 51, fineTune: 52,
    sampleID: 53, sampleModes: 54,
    overridingRootKey: 58
  };

  // ---------------------------------------------------------------
  // Low-level RIFF reading helpers
  // ---------------------------------------------------------------
  function fourCC(view, offset) {
    let s = "";
    for (let i = 0; i < 4; i++) s += String.fromCharCode(view.getUint8(offset + i));
    return s;
  }

  function cString(view, offset, maxLen) {
    let s = "";
    for (let i = 0; i < maxLen; i++) {
      const c = view.getUint8(offset + i);
      if (c === 0) break;
      s += String.fromCharCode(c);
    }
    return s.trim();
  }

  function readChunks(view, start, end) {
    const chunks = [];
    let off = start;
    while (off + 8 <= end) {
      const id = fourCC(view, off);
      const size = view.getUint32(off + 4, true);
      const dataOff = off + 8;
      chunks.push({ id, offset: dataOff, size });
      off = dataOff + size + (size % 2);
    }
    return chunks;
  }

  function findChunk(chunks, id) {
    return chunks.find(c => c.id === id);
  }

  // ---------------------------------------------------------------
  // Parse a whole .sf2 ArrayBuffer into a usable structure
  // ---------------------------------------------------------------
  function parseSF2(buffer) {
    const view = new DataView(buffer);
    if (fourCC(view, 0) !== "RIFF") throw new Error("No es un archivo RIFF válido.");
    const riffSize = view.getUint32(4, true);
    if (fourCC(view, 8) !== "sfbk") throw new Error("No es un SoundFont (sfbk) válido.");

    const top = readChunks(view, 12, 8 + riffSize);

    const infoList = top.find(c => c.id === "LIST" && fourCC(view, c.offset) === "INFO");
    const sdtaList = top.find(c => c.id === "LIST" && fourCC(view, c.offset) === "sdta");
    const pdtaList = top.find(c => c.id === "LIST" && fourCC(view, c.offset) === "pdta");
    if (!sdtaList || !pdtaList) throw new Error("Faltan los bloques sdta/pdta.");

    let sfName = "SoundFont";
    if (infoList) {
      const infoChunks = readChunks(view, infoList.offset + 4, infoList.offset + infoList.size);
      const inam = findChunk(infoChunks, "INAM");
      if (inam) sfName = cString(view, inam.offset, inam.size) || sfName;
    }

    const sdtaChunks = readChunks(view, sdtaList.offset + 4, sdtaList.offset + sdtaList.size);
    const smpl = findChunk(sdtaChunks, "smpl");
    if (!smpl) throw new Error("No se encontraron muestras de audio (smpl).");

    const pdtaChunks = readChunks(view, pdtaList.offset + 4, pdtaList.offset + pdtaList.size);
    const get = id => findChunk(pdtaChunks, id);

    // --- fixed-size record readers ---
    function readRecords(chunk, size, fn) {
      const n = chunk.size / size;
      const out = [];
      for (let i = 0; i < n; i++) out.push(fn(view, chunk.offset + i * size));
      return out;
    }

    const phdr = readRecords(get("phdr"), 38, (v, o) => ({
      name: cString(v, o, 20),
      preset: v.getUint16(o + 20, true),
      bank: v.getUint16(o + 22, true),
      bagNdx: v.getUint16(o + 24, true)
    }));
    const pbag = readRecords(get("pbag"), 4, (v, o) => ({ genNdx: v.getUint16(o, true) }));
    const pgen = readRecords(get("pgen"), 4, (v, o) => ({
      oper: v.getUint16(o, true),
      lo: v.getUint8(o + 2), hi: v.getUint8(o + 3),
      val: v.getInt16(o + 2, true), u: v.getUint16(o + 2, true)
    }));
    const inst = readRecords(get("inst"), 22, (v, o) => ({
      name: cString(v, o, 20),
      bagNdx: v.getUint16(o + 20, true)
    }));
    const ibag = readRecords(get("ibag"), 4, (v, o) => ({ genNdx: v.getUint16(o, true) }));
    const igen = readRecords(get("igen"), 4, (v, o) => ({
      oper: v.getUint16(o, true),
      lo: v.getUint8(o + 2), hi: v.getUint8(o + 3),
      val: v.getInt16(o + 2, true), u: v.getUint16(o + 2, true)
    }));
    const shdr = readRecords(get("shdr"), 46, (v, o) => ({
      name: cString(v, o, 20),
      start: v.getUint32(o + 20, true),
      end: v.getUint32(o + 24, true),
      startloop: v.getUint32(o + 28, true),
      endloop: v.getUint32(o + 32, true),
      sampleRate: v.getUint32(o + 36, true),
      originalPitch: v.getUint8(o + 40),
      pitchCorrection: v.getInt8(o + 41)
    }));

    // --- generic zone builder: groups generators into per-zone maps ---
    function buildZones(bagArr, genArr, bagStart, bagEnd) {
      const zones = [];
      for (let b = bagStart; b < bagEnd; b++) {
        const gs = bagArr[b].genNdx, ge = bagArr[b + 1].genNdx;
        const gens = {};
        for (let g = gs; g < ge; g++) gens[genArr[g].oper] = genArr[g];
        zones.push(gens);
      }
      return zones;
    }

    function keyVelRange(gens) {
      const kr = gens[GEN.keyRange], vr = gens[GEN.velRange];
      return {
        keyLo: kr ? kr.lo : 0, keyHi: kr ? kr.hi : 127,
        velLo: vr ? vr.lo : 0, velHi: vr ? vr.hi : 127
      };
    }

    // --- resolve instruments ---
    const instruments = [];
    for (let i = 0; i < inst.length - 1; i++) {
      const zones = buildZones(ibag, igen, inst[i].bagNdx, inst[i + 1].bagNdx);
      const hasGlobal = zones.length > 1 && !(GEN.sampleID in zones[0]);
      const global = hasGlobal ? zones[0] : null;
      const local = hasGlobal ? zones.slice(1) : zones;
      const resolved = [];
      for (const z of local) {
        if (!(GEN.sampleID in z)) continue;
        const merged = global ? { ...global, ...z } : z;
        const rr = keyVelRange(merged);
        resolved.push({
          ...rr,
          sampleId: merged[GEN.sampleID].u,
          sampleModes: merged[GEN.sampleModes] ? merged[GEN.sampleModes].u : 0,
          rootKeyOverride: (merged[GEN.overridingRootKey] && merged[GEN.overridingRootKey].val !== -1)
            ? merged[GEN.overridingRootKey].val : null,
          coarseTune: merged[GEN.coarseTune] ? merged[GEN.coarseTune].val : 0,
          fineTune: merged[GEN.fineTune] ? merged[GEN.fineTune].val : 0,
          startOffset: merged[GEN.startAddrsOffset] ? merged[GEN.startAddrsOffset].val : 0,
          endOffset: merged[GEN.endAddrsOffset] ? merged[GEN.endAddrsOffset].val : 0,
          startloopOffset: merged[GEN.startloopAddrsOffset] ? merged[GEN.startloopAddrsOffset].val : 0,
          endloopOffset: merged[GEN.endloopAddrsOffset] ? merged[GEN.endloopAddrsOffset].val : 0
        });
      }
      instruments.push({ name: inst[i].name, zones: resolved });
    }

    // --- resolve presets ---
    const presets = [];
    for (let i = 0; i < phdr.length - 1; i++) {
      const zones = buildZones(pbag, pgen, phdr[i].bagNdx, phdr[i + 1].bagNdx);
      const hasGlobal = zones.length > 1 && !(GEN.instrument in zones[0]);
      const global = hasGlobal ? zones[0] : null;
      const local = hasGlobal ? zones.slice(1) : zones;
      const resolved = [];
      for (const z of local) {
        if (!(GEN.instrument in z)) continue;
        const merged = global ? { ...global, ...z } : z;
        const rr = keyVelRange(merged);
        resolved.push({ ...rr, instrumentIdx: merged[GEN.instrument].u });
      }
      if (resolved.length === 0) continue;
      presets.push({
        name: phdr[i].name || "(sin nombre)",
        bank: phdr[i].bank, program: phdr[i].preset,
        zones: resolved
      });
    }
    presets.sort((a, b) => a.bank - b.bank || a.program - b.program);

    return { sfName, presets, instruments, shdr, smplOffset: smpl.offset, smplSize: smpl.size, buffer };
  }

  // ---------------------------------------------------------------
  // Audio engine
  // ---------------------------------------------------------------
  let audioCtx = null;
  const bufferCache = new Map(); // sampleId -> AudioBuffer
  const activeVoices = new Map(); // note -> {src, gain}

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function setStatus(msg, isError) {
    const el = document.getElementById("status");
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? "#ff8a8a" : "var(--green)";
  }

  function getSampleBuffer(sf, shdrEntry, sampleId, start, end) {
    const key = sampleId + ":" + start + ":" + end;
    if (bufferCache.has(key)) return bufferCache.get(key);
    const count = end - start;
    if (count <= 0) return null;
    const view = new DataView(sf.buffer);
    const byteOffset = sf.smplOffset + start * 2;
    const floatData = new Float32Array(count);
    try {
      const i16 = new Int16Array(sf.buffer.slice(byteOffset, byteOffset + count * 2));
      for (let i = 0; i < count; i++) floatData[i] = i16[i] / 32768;
    } catch (e) {
      for (let i = 0; i < count; i++) floatData[i] = view.getInt16(byteOffset + i * 2, true) / 32768;
    }
    const ctx = ensureCtx();
    const buf = ctx.createBuffer(1, count, shdrEntry.sampleRate || ctx.sampleRate);
    buf.copyToChannel(floatData, 0);
    bufferCache.set(key, buf);
    return buf;
  }

  function findVoiceZones(preset, sf, note, vel) {
    if (!preset) return null;
    let pz = preset.zones.find(z => note >= z.keyLo && note <= z.keyHi && vel >= z.velLo && vel <= z.velHi)
      || preset.zones.find(z => note >= z.keyLo && note <= z.keyHi);
    if (!pz) return null;
    const instr = sf.instruments[pz.instrumentIdx];
    if (!instr) return null;
    let iz = instr.zones.find(z => note >= z.keyLo && note <= z.keyHi && vel >= z.velLo && vel <= z.velHi)
      || instr.zones.find(z => note >= z.keyLo && note <= z.keyHi);
    if (!iz) return null;
    return iz;
  }

  function noteOn(sf, preset, note, vel = 100) {
    try {
      const iz = findVoiceZones(preset, sf, note, vel);
      if (!iz) { setStatus(`Nota ${note} (${noteName(note)}): fuera del rango de este preset.`, true); return; }
      const shdrEntry = sf.shdr[iz.sampleId];
      if (!shdrEntry) { setStatus(`Nota ${note}: el índice de muestra (${iz.sampleId}) no existe en shdr.`, true); return; }

      const start = shdrEntry.start + iz.startOffset;
      const end = shdrEntry.end + iz.endOffset;
      const loopStart = shdrEntry.startloop + iz.startloopOffset;
      const loopEnd = shdrEntry.endloop + iz.endloopOffset;

      const buffer = getSampleBuffer(sf, shdrEntry, iz.sampleId, start, end);
      if (!buffer) { setStatus(`Nota ${note}: muestra "${shdrEntry.name}" con longitud inválida (start=${start}, end=${end}).`, true); return; }

      const ctx = ensureCtx();
      stopVoice(note, true);

      const rootKey = iz.rootKeyOverride != null ? iz.rootKeyOverride
        : (shdrEntry.originalPitch === 255 ? 60 : shdrEntry.originalPitch);
      const centsOffset = (shdrEntry.pitchCorrection || 0) + iz.fineTune + iz.coarseTune * 100;
      const rate = Math.pow(2, ((note - rootKey) * 100 - centsOffset) / 1200);

      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = rate;

      const loop = (iz.sampleModes === 1 || iz.sampleModes === 3) && loopEnd > loopStart;
      if (loop) {
        src.loop = true;
        src.loopStart = Math.max(0, (loopStart - start) / shdrEntry.sampleRate);
        src.loopEnd = Math.max(src.loopStart + 0.001, (loopEnd - start) / shdrEntry.sampleRate);
      }

      const gain = ctx.createGain();
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.85, now + 0.006);

      src.connect(gain).connect(ctx.destination);
      src.start(now);
      activeVoices.set(note, { src, gain });
      setStatus(`▶ ${shdrEntry.name} · nota ${noteName(note)} · ctx: ${ctx.state} · rate ${rate.toFixed(3)}`, false);
    } catch (err) {
      setStatus("Error al reproducir: " + err.message, true);
      console.error(err);
    }
  }

  function stopVoice(note, immediate) {
    const v = activeVoices.get(note);
    if (!v) return;
    const ctx = ensureCtx();
    const now = ctx.currentTime;
    try {
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setValueAtTime(v.gain.gain.value, now);
      const rel = immediate ? 0.01 : 0.09;
      v.gain.gain.linearRampToValueAtTime(0, now + rel);
      v.src.stop(now + rel + 0.02);
    } catch (e) { /* already stopped */ }
    activeVoices.delete(note);
  }

  // ---------------------------------------------------------------
  // UI wiring
  // ---------------------------------------------------------------
  let sf = null;
  let currentPreset = null;
  let octaveBase = 48; // low C of visible range (C3)
  const OCTAVES_SHOWN = 3;

  const dropzone = document.getElementById("dropzone");
  const dzText = document.getElementById("dzText");
  const dzFname = document.getElementById("dzFname");
  const fileInput = document.getElementById("fileInput");
  const metaEl = document.getElementById("meta");
  const presetListEl = document.getElementById("presetList");
  const currentPresetEl = document.getElementById("currentPreset");
  const hintEl = document.getElementById("hint");
  const pianoEl = document.getElementById("piano");
  const octaveLabel = document.getElementById("octaveLabel");

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  function noteName(n) { return NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1); }

  function loadFile(file) {
    if (!file) return;
    dzText.textContent = "Leyendo…";
    dzFname.textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        sf = parseSF2(reader.result);
        renderPresetList();
        metaEl.textContent = `${sf.presets.length} presets · ${sf.instruments.length} instrumentos`;
        dzText.textContent = "Cargado:";
        currentPreset = null;
        currentPresetEl.textContent = "—";
        hintEl.textContent = "Elegí un preset de la lista y tocá el teclado para escucharlo.";
      } catch (err) {
        dzText.textContent = "Error: " + err.message;
        dzFname.textContent = "";
        metaEl.textContent = "";
      }
    };
    reader.onerror = () => { dzText.textContent = "No se pudo leer el archivo."; };
    reader.readAsArrayBuffer(file);
  }

  function renderPresetList() {
    presetListEl.innerHTML = "";
    sf.presets.forEach((p, idx) => {
      const row = document.createElement("button");
      row.className = "preset-row";
      row.dataset.idx = idx;
      const bankStr = String(p.bank).padStart(3, "0");
      const progStr = String(p.program).padStart(3, "0");
      row.innerHTML = `<span class="idx">${bankStr}:${progStr}</span><span class="nm">${escapeHtml(p.name)}</span>`;
      row.addEventListener("click", () => selectPreset(idx, true));
      presetListEl.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function selectPreset(idx, preview) {
    currentPreset = sf.presets[idx];
    [...presetListEl.children].forEach(el => el.classList.toggle("active", Number(el.dataset.idx) === idx));
    const bankStr = String(currentPreset.bank).padStart(3, "0");
    const progStr = String(currentPreset.program).padStart(3, "0");
    currentPresetEl.innerHTML = `<span class="bank">${bankStr}:${progStr}</span>${escapeHtml(currentPreset.name)}`;
    hintEl.textContent = "Tocá una tecla del piano (o de tu teclado) para escucharlo.";
    if (preview) {
      ensureCtx();
      const note = 60 >= currentPreset.zones[0].keyLo && 60 <= currentPreset.zones[0].keyHi
        ? 60 : Math.floor((currentPreset.zones[0].keyLo + currentPreset.zones[0].keyHi) / 2);
      noteOn(sf, currentPreset, note, 100);
      setTimeout(() => stopVoice(note, false), 500);
    }
  }

  // ---- drop / file picking ----
  // The whole window is a drop target (not just the small header bar), and we
  // must preventDefault on dragover everywhere or the browser will just try
  // to open/navigate to the dropped file instead of firing our handler.
  const dragOverlay = document.getElementById("dragOverlay");
  let dragCounter = 0;

  window.addEventListener("dragenter", e => {
    e.preventDefault();
    if (e.dataTransfer && [...e.dataTransfer.items || []].some(i => i.kind === "file")) {
      dragCounter++;
      dragOverlay.classList.add("show");
    }
  });
  window.addEventListener("dragover", e => { e.preventDefault(); });
  window.addEventListener("dragleave", e => {
    e.preventDefault();
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) dragOverlay.classList.remove("show");
  });
  window.addEventListener("drop", e => {
    e.preventDefault();
    dragCounter = 0;
    dragOverlay.classList.remove("show");
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  // ---- piano rendering ----
  const BLACK_AFTER = { 0: true, 1: false, 2: true, 3: true, 4: false, 5: true, 6: true, 7: true, 8: false, 9: true, 10: true, 11: false };
  // whether a black key sits after this semitone-in-octave (0=C,1=C#,...)

  function buildPiano() {
    pianoEl.innerHTML = "";
    const lowNote = octaveBase;
    const highNote = octaveBase + OCTAVES_SHOWN * 12; // inclusive top C
    let whiteX = 0;
    const whiteWidth = 38, blackWidth = 24;

    const whiteKeys = [];
    for (let n = lowNote; n <= highNote; n++) {
      const inOct = n % 12;
      const isWhite = [0, 2, 4, 5, 7, 9, 11].includes(inOct);
      if (isWhite) whiteKeys.push(n);
    }

    whiteKeys.forEach(n => {
      const key = document.createElement("div");
      key.className = "white-key";
      key.dataset.note = n;
      if (n % 12 === 0) {
        const lbl = document.createElement("div");
        lbl.className = "lbl";
        lbl.textContent = noteName(n);
        key.appendChild(lbl);
      }
      pianoEl.appendChild(key);
    });

    // position black keys absolutely based on white key index
    let wIdx = 0;
    for (let n = lowNote; n < highNote; n++) {
      const inOct = n % 12;
      const isWhite = [0, 2, 4, 5, 7, 9, 11].includes(inOct);
      if (isWhite) {
        if (BLACK_AFTER[inOct]) {
          const bk = document.createElement("div");
          bk.className = "black-key";
          bk.dataset.note = n + 1;
          bk.style.left = ((wIdx + 1) * whiteWidth - blackWidth / 2) + "px";
          pianoEl.appendChild(bk);
        }
        wIdx++;
      }
    }

    octaveLabel.textContent = `${noteName(lowNote)}–${noteName(highNote)}`;

    pianoEl.querySelectorAll(".white-key, .black-key").forEach(el => {
      const note = Number(el.dataset.note);
      const press = e => { e.preventDefault(); ensureCtx(); el.classList.add("down"); if (currentPreset) noteOn(sf, currentPreset, note, 100); };
      const release = e => { el.classList.remove("down"); stopVoice(note, false); };
      el.addEventListener("mousedown", press);
      el.addEventListener("mouseup", release);
      el.addEventListener("mouseleave", release);
      el.addEventListener("touchstart", press, { passive: false });
      el.addEventListener("touchend", release);
    });
  }

  document.getElementById("octDown").addEventListener("click", () => {
    octaveBase = Math.max(0, octaveBase - 12);
    buildPiano();
  });
  document.getElementById("octUp").addEventListener("click", () => {
    octaveBase = Math.min(127 - OCTAVES_SHOWN * 12, octaveBase + 12);
    buildPiano();
  });

  buildPiano();

  document.getElementById("fastTest").addEventListener("click", () => {
    if (!sf || !sf.presets.length) { setStatus("Primero cargá un SoundFont.", true); return; }
    selectPreset(0, false);
    const preset = currentPreset;
    ensureCtx();
    const cNotes = [];
    for (let n = 0; n <= 120; n += 12) cNotes.push(n); // C-1 .. C9
    let i = 0;
    setStatus(`Fast test: preset "${preset.name}" · ${cNotes.length} notas Do, medio segundo cada una.`, false);
    function step() {
      if (i > 0) stopVoice(cNotes[i - 1], true);
      if (i >= cNotes.length) return;
      const note = cNotes[i];
      noteOn(sf, preset, note, 100);
      const el = pianoEl.querySelector(`[data-note="${note}"]`);
      if (el) el.classList.add("down");
      setTimeout(() => { if (el) el.classList.remove("down"); }, 480);
      i++;
      setTimeout(step, 500);
    }
    step();
  });

  document.getElementById("testTone").addEventListener("click", () => {
    const ctx = ensureCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = 440;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.55);
    setStatus(`Contexto de audio: ${ctx.state}. Si no escuchaste un beep, el problema es del navegador/permisos de audio, no del SoundFont.`, ctx.state !== "running");
  });

  // ---- computer keyboard mapping ----
  const KEY_TO_SEMITONE = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12 };
  let kbOctaveShift = 0;
  const heldKeys = new Set();

  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === "z") { kbOctaveShift = Math.max(-3, kbOctaveShift - 1); return; }
    if (k === "x") { kbOctaveShift = Math.min(3, kbOctaveShift + 1); return; }
    if (!(k in KEY_TO_SEMITONE) || !currentPreset) return;
    const note = 60 + kbOctaveShift * 12 + KEY_TO_SEMITONE[k];
    if (heldKeys.has(k)) return;
    heldKeys.add(k);
    ensureCtx();
    noteOn(sf, currentPreset, note, 100);
    const el = pianoEl.querySelector(`[data-note="${note}"]`);
    if (el) el.classList.add("down");
  });
  window.addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    if (!(k in KEY_TO_SEMITONE)) return;
    heldKeys.delete(k);
    const note = 60 + kbOctaveShift * 12 + KEY_TO_SEMITONE[k];
    stopVoice(note, false);
    const el = pianoEl.querySelector(`[data-note="${note}"]`);
    if (el) el.classList.remove("down");
  });
})();
</script>
</body>
</html>
